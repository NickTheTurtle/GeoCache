services:
  - type: web
    name: geocache-sf
    runtime: node
    # Persistent disks require a paid instance type on Render; "free" is invalid with a disk.
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: node server.js
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATA_DIR
        value: /var/data
    disk:
      name: geocache-data
      mountPath: /var/data
      sizeGB: 1
