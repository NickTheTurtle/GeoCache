name: CI

# Runs on every pull request, and again on main after a merge. The server's
# auto-deploy (deploy/auto-deploy.sh) only ships a main commit once this
# workflow's run for it has succeeded.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # The e2e server only serves HTTPS when certs/ exists, and the suite drives
      # Microsoft Edge (channel: 'msedge'), same as local runs.
      - name: Self-signed cert for the e2e server
        run: npm run gen-cert

      - name: Install Edge for Playwright
        run: npx playwright install --with-deps msedge

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
